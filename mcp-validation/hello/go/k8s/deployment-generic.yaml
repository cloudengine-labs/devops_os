apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-go
  namespace: default
  labels: &id001
    app: hello-go
spec:
  replicas: 2
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: hello-go
        image: myregistry/my-app:latest
        ports:
        - containerPort: 8080
        resources:
          requests: {memory: 64Mi, cpu: 250m}
          limits: {memory: 128Mi, cpu: 500m}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-go
  namespace: default
spec:
  selector: {app: hello-go}
  ports:
  - {protocol: TCP, port: 8080, targetPort: 8080}
  type: ClusterIP
