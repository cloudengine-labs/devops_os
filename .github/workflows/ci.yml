name: CI

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r mcp_server/requirements.txt pytest

      - name: Run MCP server tests
        run: pytest mcp_server/test_server.py tests/ -v

  http-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r mcp_server/requirements.txt pytest pytest-asyncio httpx

      - name: Run HTTP integration tests
        run: pytest mcp_server/test_http.py -v
        continue-on-error: true

      - name: Run smoke test (stdio)
        run: python3 scripts/smoke-test.py --transport stdio
        continue-on-error: true
